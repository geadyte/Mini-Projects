<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Memory Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">

  <h1>🎮 Simon Says</h1>

  <p id="status">Press Start to Play</p>

  <div class="score-box">
    Level: <span id="level">0</span>
  </div>

  <div class="game-board">

    <div class="btn green" data-color="green"></div>
    <div class="btn red" data-color="red"></div>
    <div class="btn yellow" data-color="yellow"></div>
    <div class="btn blue" data-color="blue"></div>

  </div>

  <button id="startBtn">
    Start Game
  </button>

</div>

<script src="script.js"></script>
</body>
</html>
