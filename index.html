<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Mini Projects</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    padding: 40px;
  }

  h1 {
    text-align: center;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
  }

  .card {
    background: #111827;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #000;
  }

  .content {
    padding: 15px;
  }

  .title {
    font-size: 16px;
    margin-bottom: 10px;
  }

  a {
    text-decoration: none;
    color: #22c55e;
    font-weight: bold;
  }

  a:hover { text-decoration: underline; }
</style>
</head>

<body>
<h1>My Mini Projects</h1>

<div class="grid" id="grid"></div>

<script>

const projects = [
  "pj 1 (To-do list)","pj 2 (login page)","pj 3 (gradient border)","pj 4 (Animated border desgin)","pj 5 (Navigation bar hover animation)",
  "pj 6 (Image gallary)","pj 7 (3D rotating cube)","pj 8 (Custom Scroll Dots)","pj 9 (Color picker)","pj 10 (Light-Dark mode toggle)",
  "pj 11 (Password Generator)","pj 12 (Color palette generator)","pj 13 (Currency converter)","pj 14 (QR code generator)",
  "pj 15 (Calendar)","pj 16 (URL shortener)","pj 17 (Rock Paper Scissors)","pj 18 (Tic Tac Toe)",
  "pj 19 (Simon Says Memory Game)","pj 20 (Sudoku game)"
  // add all folders here
];

const grid = document.getElementById("grid");

projects.forEach(name => {
  const url = `./${name}/`;

  // Using thum.io to auto-generate preview image
  const preview = `https://image.thum.io/get/width/800/${location.origin}${location.pathname}${name}/`;

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${preview}" alt="${name} preview">
    <div class="content">
      <div class="title">${name}</div>
      <a href="${url}" target="_blank">Open Project →</a>
    </div>
  `;

  grid.appendChild(card);
});
</script>

</body>
</html>
